# cargo-deny configuration for gm-kms
# Migrated to v2 format (cargo-deny 0.18+): https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

ignore = [
    # RUSTSEC-2026-0190: anyhow Error::downcast_mut unsound
    #   only affects code calling downcast_mut(); kms does not use this API
    "RUSTSEC-2026-0190",
    # RUSTSEC-2023-0071: RSA Marvin Attack
    #   no safe upgrade available; rsa crate used only for key parsing, not decryption
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # ring: MIT AND ISC AND OpenSSL
    "MIT",
    "ISC",
    "OpenSSL",
]

# Per-crate license exceptions
[[licenses.exceptions]]
name = "ring"
allow = ["MIT", "ISC", "OpenSSL"]

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[output]
feature-depth = 1
