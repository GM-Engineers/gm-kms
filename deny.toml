# cargo-deny configuration for gm-kms
# Migrated to v2 format (cargo-deny 0.18+): https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

ignore = [
    # RUSTSEC-2023-0071: RSA Marvin Attack
    #   no safe upgrade available; rsa crate used only for key parsing, not decryption
    "RUSTSEC-2023-0071",
    # RUSTSEC-2023-0089: atomic-polyfill is unmaintained
    #   No safe upgrade available (crate archived, advisory states so). Pulled in
    #   transitively by postcard 1.1.3 -> gm-tls; only used for no_std atomic emulation.
    "RUSTSEC-2023-0089",
    # RUSTSEC-2025-0134: rustls-pemfile is unmaintained
    #   No safe upgrade available. Pulled in transitively by redis 0.26.1 ->
    #   deadpool-redis -> gm-tls. Upstream (redis) must migrate to rustls-pki-types;
    #   this repo does not call rustls-pemfile directly.
    "RUSTSEC-2025-0134",
    # RUSTSEC-2026-0387: crypto-bigint timing variability
    #   Patched only in >=0.7.6, a breaking jump the rsa crate does not allow. gm-kms
    #   reaches crypto-bigint solely via rsa OAEP *encryption* (public-key side) and holds
    #   no RSA private key, so the secret-dependent branches cannot leak local material.
    "RUSTSEC-2026-0387",
    # RUSTSEC-2026-0367/0368/0369: zip extraction flaws
    #   Patched only in >=9.0.0, incompatible with the 3.x pinned by utoipa-swagger-ui.
    #   zip is a build-dependency that unpacks the vendored (trusted) Swagger UI asset at
    #   compile time; gm-kms never extracts attacker-controlled archives at runtime.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # ring: MIT AND ISC AND OpenSSL
    "MIT",
    "ISC",
    "OpenSSL",
]

# Per-crate license exceptions
[[licenses.exceptions]]
name = "ring"
allow = ["MIT", "ISC", "OpenSSL"]

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[output]
feature-depth = 1
