[workspace]
resolver = "2"
members = [
    "crates/kms-core",
    "crates/kms-keystore",
    "crates/kms-policy",
    "crates/kms-audit",
    "crates/kms-api",
    "crates/kms-cli",
    "crates/kms-hsm",
    "crates/kms-mfa",
    "crates/kms-approval",
]

[package]
name = "kms"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "kms"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"

# Web
axum = { workspace = true }
tower-http = { workspace = true }

# gRPC
tonic = "0.14"
tonic-health = "0.14"

# GM TLS for mTLS (TLS 1.3 + SM ciphers; gm-tls 0.2 dropped the TLCP module — TLCP
# now lives in the standalone gm-tlcp crate, which gm-kms does not depend on).
gm-tls = { version = "0.2", features = ["grpc"] }

# TLS for REST API (rustls for native TLS support)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# CLI
clap = { workspace = true }

# Utilities
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# Redis
redis = { workspace = true }

# Workspace dependencies
kms-core = { path = "crates/kms-core" }
kms-keystore = { path = "crates/kms-keystore" }
kms-policy = { path = "crates/kms-policy" }
kms-audit = { path = "crates/kms-audit" }
kms-api = { path = "crates/kms-api" }
kms-hsm = { path = "crates/kms-hsm" }
gm-sm9-rs = { version = "0.1.0" }

# Cryptography
rand = { workspace = true }

# OpenAPI / Swagger
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# SM2 certificate generation (dev/test only)
gm-ca = { version = "0.1.0" }
gm-crypto = { version = "0.2" }
elliptic-curve = "0.13"
asn1 = "0.17"
tempfile = "3"
pem = "3"
x509-parser = "0.16"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Eric Zhang"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GM-Engineers/gm-kms"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Synchronization (poison-free, faster than std)
parking_lot = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# gRPC
tonic = "0.14"
prost = "0.13"
prost-build = "0.13"
tonic-prost-build = "0.14"
tonic-health = "0.14"

# Cryptography
ring = "0.17"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# EC DH (for ECDH key exchange with existing keys)
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", features = ["ecdh"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# GM 国密 SM2/SM3/SM4
gm-crypto = { version = "0.2" }
gm-sm9-rs = { version = "0.1.0" }
sm2 = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls-ring-native-roots"] }

# Redis for caching (includes cluster support)
redis = { version = "0.26", features = ["tokio-comp", "connection-manager", "cluster", "tls-rustls", "tokio-rustls-comp", "rustls-native-certs", "rustls-pemfile"] }

# For repository pattern
kms-keystore = { path = "crates/kms-keystore" }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
hex = "0.4"

# OpenAPI / Swagger
utoipa = "5"
utoipa-swagger-ui = "9"

# Configuration
config = "0.14"
toml = "0.8"

# Kafka for audit streaming (Phase 2)
rdkafka = { version = "0.36", features = ["tokio"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Regex for policy matching
regex = "1.10"

# HTTP client for webhooks
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

# For SM2 certificate generation (dev/test only)
gm-ca = { version = "0.1.0" }
elliptic-curve = "0.13"
asn1 = "0.17"
tempfile = "3"
pem = "3"
x509-parser = "0.16"

[features]
default = []
kafka = ["kms-audit/kafka"]
tpm2-tss = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
base64 = "0.22"
tempfile = "3"
hex = "0.4"
ring = "0.17"
chrono = { workspace = true }
gm-crypto = { version = "0.2" }
gm-sm9-rs = { version = "0.1.0" }

# gm-ca 0.1.1 + gm-tls 0.2.0 + gm-crypto 0.2.0 + gm-sm9-rs 0.1.0 是 gm 仓库
# 0.3.0 release 的协调版本（发布于 commit 37e1b21 / tag gm-tls-v0.2.0）。gm-kms
# 通过 patch.crates-io 将 gm-ca / gm-crypto / gm-sm9-rs 锁定到同一 git rev，
# 以确保所有使用者从同一源加载同版本的 gm-crypto，避免 cargo 解出“同一 crate
# 两个不同源”（crates.io 0.1.0 与 git 0.2.0）导致 examples/generate_sm2_certs.rs
# 中 Sm2KeyPair 传给 gm_ca::cert::CaSigner 的 E0308 类型不匹配。
#
# kms 二进制本身不交叉 gm_crypto 类型（不使用 CaSigner），故即使双源问题存在
# Release 构建不受影响；但 cargo check --workspace --all-targets 会暴露该问题。
#
# 同步点选 37e1b21（gm-tls-v0.2.0 tag 提交）而非 bf31dbb（main HEAD）的原因：
# 37e1b21 是已发布的 tag，包含协调后的 0.2.0 版本号；bf31dbb 仅多出文档微调，
# 与生产构建无关。后续如 gm 仓库再次发布，可仅修改下面三条 git rev 同步。
[patch.crates-io]
gm-ca = { git = "https://github.com/GM-Engineers/gm", rev = "37e1b21a32198e70cccb3dfc49cf8d31f57b277b" }
gm-crypto = { git = "https://github.com/GM-Engineers/gm", rev = "37e1b21a32198e70cccb3dfc49cf8d31f57b277b" }
gm-sm9-rs = { git = "https://github.com/GM-Engineers/gm", rev = "37e1b21a32198e70cccb3dfc49cf8d31f57b277b" }
