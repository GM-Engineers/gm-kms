[workspace]
resolver = "2"
members = [
    "crates/kms-core",
    "crates/kms-keystore",
    "crates/kms-policy",
    "crates/kms-audit",
    "crates/kms-api",
    "crates/kms-cli",
    "crates/kms-hsm",
    "crates/kms-mfa",
    "crates/kms-approval",
]

[package]
name = "kms"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "kms"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"

# Web
axum = { workspace = true }
tower-http = { workspace = true }

# gRPC
tonic = "0.14"
tonic-health = "0.14"

# GM TLS for mTLS (TLS 1.3 + SM ciphers; gm-tls 0.2 dropped the TLCP module — TLCP
# now lives in the standalone gm-tlcp crate).
gm-tls = { version = "0.2", features = ["grpc"] }

# TLCP (GB/T 38636-2020) for REST listener (see src/cmd/tlcp_listener.rs).
# REST over TLCP is wired in 0.3.0; gRPC stays on TLS 1.3 + SM (TLCP has no ALPN).
gm-tlcp = { version = "0.6" }

# TLS for REST API (rustls for native TLS support)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# CLI
clap = { workspace = true }

# Utilities
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# Redis
redis = { workspace = true }

# Workspace dependencies
kms-core = { path = "crates/kms-core" }
kms-keystore = { path = "crates/kms-keystore" }
kms-policy = { path = "crates/kms-policy" }
kms-audit = { path = "crates/kms-audit" }
kms-api = { path = "crates/kms-api" }
kms-hsm = { path = "crates/kms-hsm" }
gm-sm9-rs = { version = "0.1.0" }

# Cryptography
rand = { workspace = true }

# OpenAPI / Swagger
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# SM2 certificate generation (dev/test only)
gm-ca = { version = "0.1.0" }
gm-crypto = { version = "0.3" }
elliptic-curve = "0.13"
asn1 = "0.17"
tempfile = "3"
pem = "3"
x509-parser = "0.16"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Eric Zhang"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GM-Engineers/gm-kms"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Synchronization (poison-free, faster than std)
parking_lot = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# gRPC
tonic = "0.14"
prost = "0.13"
prost-build = "0.13"
tonic-prost-build = "0.14"
tonic-health = "0.14"

# Cryptography
ring = "0.17"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# EC DH (for ECDH key exchange with existing keys)
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", features = ["ecdh"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# GM 国密 SM2/SM3/SM4
gm-crypto = { version = "0.3" }
gm-sm9-rs = { version = "0.1.0" }
sm2 = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls-ring-native-roots"] }

# Redis for caching (includes cluster support)
redis = { version = "0.26", features = ["tokio-comp", "connection-manager", "cluster", "tls-rustls", "tokio-rustls-comp", "rustls-native-certs", "rustls-pemfile"] }

# For repository pattern
kms-keystore = { path = "crates/kms-keystore" }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
hex = "0.4"

# OpenAPI / Swagger
utoipa = "5"
utoipa-swagger-ui = "9"

# Configuration
config = "0.14"
toml = "0.8"

# Kafka for audit streaming (Phase 2)
rdkafka = { version = "0.36", features = ["tokio"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Regex for policy matching
regex = "1.10"

# HTTP client for webhooks
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

# For SM2 certificate generation (dev/test only)
gm-ca = { version = "0.1.0" }
elliptic-curve = "0.13"
asn1 = "0.17"
tempfile = "3"
pem = "3"
x509-parser = "0.16"

[features]
default = []
kafka = ["kms-audit/kafka"]
tpm2-tss = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
base64 = "0.22"
tempfile = "3"
hex = "0.4"
ring = "0.17"
chrono = { workspace = true }
gm-crypto = { version = "0.3" }
gm-sm9-rs = { version = "0.1.0" }

# gm-ca 0.1.x + gm-tls 0.2.1 + gm-crypto 0.3.x + gm-sm9-rs 0.1.x + gm-tlcp 0.6.x 是
# gm 仓库的协调版本（发布于 tag gm-tlcp-v0.6.4 = a7fdf20）。gm-kms 通过
# patch.crates-io 将以上五个 crate 锁定到同一 git rev，以确保所有使用者从同一源加载
# 同一版本的 gm-crypto，避免 cargo 解出“同一 crate 两个不同源”（crates.io 0.x 与 git
# 0.y）导致 examples/generate_sm2_certs.rs 中 Sm2KeyPair 传给 gm_ca::cert::CaSigner
# 的 E0308 类型不匹配。
#
# kms 二进制本身不交叉 gm_crypto 类型（不使用 CaSigner），故即使双源问题存在
# Release 构建不受影响；但 cargo check --workspace --all-targets 会暴露该问题。
#
# gm-tls 必须也加入 patch：crates.io gm-tls 0.2.0 强依赖 gm-crypto 0.2.0，会绕过
# 上面的 patch、引入 crates.io 版 gm-crypto，与 git 版（0.3.x）形成双源。
# gm-tls 0.2.1 依赖 gm-crypto 0.3，与其他 crate 协调。
#
# 同步点选 a7fdf20（gm-tlcp-v0.6.4 tag 提交）而非 bf31dbb（main HEAD）的原因：
# a7fdf20 是已发布的协调版本，五个 crate 都在同一 tag 下发布；HEAD 仅多出文档/示例
# 微调，与生产构建无关。后续如 gm 仓库再次发布，可仅修改下面五条 git rev 同步。
[patch.crates-io]
gm-ca     = { git = "https://github.com/GM-Engineers/gm", rev = "a7fdf20ada33ba59393bc3c6aa8b81198cbf621b" }
gm-crypto = { git = "https://github.com/GM-Engineers/gm", rev = "a7fdf20ada33ba59393bc3c6aa8b81198cbf621b" }
gm-sm9-rs = { git = "https://github.com/GM-Engineers/gm", rev = "a7fdf20ada33ba59393bc3c6aa8b81198cbf621b" }
gm-tlcp   = { git = "https://github.com/GM-Engineers/gm", rev = "a7fdf20ada33ba59393bc3c6aa8b81198cbf621b" }
gm-tls    = { git = "https://github.com/GM-Engineers/gm", rev = "a7fdf20ada33ba59393bc3c6aa8b81198cbf621b" }
