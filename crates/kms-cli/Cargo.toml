version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kmsclient"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true }
clap_complete = "4.5"

# Utils
anyhow = { workspace = true }
