[package]
rust-version.workspace = true
name = "kms-mfa"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# TOTP implementation
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }

# Cryptography
hex.workspace = true
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.10"
subtle = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Time handling
chrono = "0.4"

# Base32 encoding
base32 = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
