name: Release

# 自动构建多平台二进制并发布到 GitHub Releases。
# 触发方式：推送版本标签，例如  git tag v0.1.0 && git push origin v0.1.0
# 无需手动编译；CI 会在 ubuntu/macos/windows + x86_64/aarch64 上交叉构建并附到 Release。
#
# 注意：gm-kms 默认使用 pure-rust 后端（gm-crypto/gm-tls 默认 features 不含 gmssl），
#       因此发布二进制不依赖 GmSSL 等 C 库，可干净地跨平台交叉编译。
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,    bin: kms,      artifact: kms-linux-x86_64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,   bin: kms,      artifact: kms-linux-aarch64, apt: gcc-aarch64-linux-gnu, cross-linker: aarch64-linux-gnu-gcc }
          - { os: macos-latest,   target: x86_64-apple-darwin,         bin: kms,      artifact: kms-macos-x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,        bin: kms,      artifact: kms-macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      bin: kms.exe,  artifact: kms-windows-x86_64.exe }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          targets: ${{ matrix.target }}

      # kms-api/build.rs 用 tonic_prost_build::compile_protos 编译 proto，
      # 构建时必须有 protoc；build 脚本在宿主机执行，故三系统都需安装。
      - name: Install protoc
        uses: arduino/setup-protoc@v3.0.0

      # aarch64-linux 在 ubuntu 上交叉编译，需要交叉链接器。
      # 因 gm-kms 发布构建为纯 Rust（无 gmssl 等 C 依赖），无需交叉编译 C 库，
      # 直接用宿主机 protoc + aarch64 链接器即可，比 cross 容器方案更透明。
      - name: Install cross-compilation linker (aarch64-linux)
        if: ${{ matrix.apt != '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.cross-linker }}" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build (cargo)
        run: cargo build -p kms --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f -print0 | xargs -0 sha256sum > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
